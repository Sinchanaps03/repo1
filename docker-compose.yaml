services:

  java-app:
    build: .
    container_name: java-app
    expose:
      - "80"
    restart: always

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - java-app
    restart: always